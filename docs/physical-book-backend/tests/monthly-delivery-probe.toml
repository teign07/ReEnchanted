name = "monthly-delivery-local-rehearsal"
main = "monthly-delivery-probe.mjs"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "MONTHLY_ISSUE_FILES"
bucket_name = "monthly-rehearsal-local-only"

[[kv_namespaces]]
binding = "PHYSICAL_BOOK_ORDERS"
id = "monthly-rehearsal-local-only"

[[durable_objects.bindings]]
name = "PHYSICAL_BOOK_ORDER_COORDINATOR"
class_name = "PhysicalBookOrderCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PhysicalBookOrderCoordinator"]
