name = "reenchanted-physical-books"
main = "lulu-quote-worker.mjs"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[vars]
LULU_API_BASE_URL = "https://api.sandbox.lulu.com"
LULU_AUTH_URL = "https://api.sandbox.lulu.com/auth/realms/glasstree/protocol/openid-connect/token"
CHECKOUT_MODE = "test"
# Deliberate launch switch. Leave false until Stripe webhooks are configured
# and Stripe + Lulu are both verified in CHECKOUT_MODE.
PHYSICAL_BOOK_ORDERING_ENABLED = "true"
# Stripe Tax is the reader-facing sales-tax/VAT authority. Live checkout will
# remain closed while this is false, even if the general ordering switch is on.
STRIPE_TAX_ENABLED = "false"
# Stripe test catalogue only, matching BoundYearPricing in the app.
STRIPE_BOUND_YEAR_MONTHLY_PRICE = "price_1UDBjrE80ArNx7J9p2acRpvE"
STRIPE_BOUND_YEAR_ANNUAL_PRICE = "price_1UDBjrE80ArNx7J9JEGVlZ08"
# Optional overrides. The defaults are Stripe's Books, Periodicals, and
# Shipping tax codes.
# STRIPE_PRINTED_BOOK_TAX_CODE = "txcd_35010000"
# STRIPE_PERIODICAL_TAX_CODE = "txcd_35020200"
# STRIPE_SHIPPING_TAX_CODE = "txcd_92010001"
# Required secret for Bound Year destinations whose later parcels need a
# recipient customs ID: npx wrangler secret put MEMBERSHIP_CUSTOMS_ENCRYPTION_KEY
# Separate live-money gate. Test-mode membership proofs remain available, but
# production Bound Year sales fail closed until one complete sandbox parcel has
# been verified. (The digital offer-code grant is no longer needed while the
# Digital Standing Order is retired: monthly stories are free for everyone.)
BOUND_YEAR_LIVE_SALES_ENABLED = "false"
# The Digital Standing Order is retired, so the monthly issue shelf is open to
# every installation. Remove this line to restore the subscription/Bound Year
# gate in monthly-issues.mjs.
MONTHLY_ISSUES_OPEN_TO_ALL = "true"
# Publisher Ed25519 public key (raw 32 bytes, base64). The same value is the
# app's MonthlyIssueManifestPublicKey. The private half lives only in the
# publishing environment (~/.reenchanted-publishing), never in this repo.
MONTHLY_ISSUE_MANIFEST_PUBLIC_KEY = "qlO/TluW8kH+biDJa+eJoWu6BY7a6WKduKF3LNhCBw4="
# The Worker derives random, expiring print-file capability URLs from its own
# HTTPS request origin. Keep the R2 bucket private; never attach an r2.dev domain.
# Optional: send PII-free paid-without-print alerts to an HTTPS operations hook.
# SECURITY_ALERT_WEBHOOK_URL = "https://..."

# The reconciliation alarm is capability-limited to this single verified inbox
# and this sender on the managed reenchanted.app domain.
[[send_email]]
name = "SECURITY_ALERT_EMAIL"
destination_address = "snow.potions@gmail.com"
allowed_sender_addresses = ["print-desk-alerts@reenchanted.app"]

# Optional: override the shipping levels shown by the iOS app.
# LULU_SHIPPING_LEVELS_JSON = "[{\"id\":\"MAIL\",\"displayName\":\"Mail\",\"estimatedDaysMin\":5,\"estimatedDaysMax\":10}]"

# Bind this to a private R2 bucket used for generated interior/cover PDFs.
[[r2_buckets]]
binding = "PHYSICAL_BOOK_FILES"
bucket_name = "reenchanted-physical-book-files"

# Monthly issues: manifest.envelope.json plus assets/ASSET_ID. Private; no
# r2.dev domain. Served only through /monthly-issues with a session token.
[[r2_buckets]]
binding = "MONTHLY_ISSUE_FILES"
bucket_name = "reenchanted-monthly-issues"

# Bind this before production so repeated /orders calls do not create duplicate
# Lulu print jobs for the same Stripe PaymentIntent.
[[kv_namespaces]]
binding = "PHYSICAL_BOOK_ORDERS"
id = "6413f2a5fc084312834b48cfaaf12440"

[[ratelimits]]
name = "PHYSICAL_BOOK_RATE_LIMITER"
namespace_id = "12002"

[ratelimits.simple]
limit = 12
period = 60

[exports.PhysicalBookOrderCoordinator]
type = "durable-object"
storage = "sqlite"

[[durable_objects.bindings]]
name = "PHYSICAL_BOOK_ORDER_COORDINATOR"
class_name = "PhysicalBookOrderCoordinator"
